services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foodbank_inventory_development
      POSTGRES_USER: foodbank_inventory
      POSTGRES_PASSWORD: foodbank_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbank_inventory -d foodbank_inventory_development"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_v18: