default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "foodbank_inventory") %>
  password: <%= ENV.fetch("DB_PASSWORD", "foodbank_inventory") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: foodbank_inventory_development

test:
  <<: *default
  database: foodbank_inventory_test

production:
  <<: *default
  database: foodbank_inventory_production
